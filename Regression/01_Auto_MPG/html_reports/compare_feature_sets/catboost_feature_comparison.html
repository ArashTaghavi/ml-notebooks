
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Feature Sets Comparison</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;

            background: #f5f7fa;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #1f2937;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0;

            font-size: 28px;
            font-weight: 700;
        }

        .header p {
            margin-top: 8px;

            color: #6b7280;
            font-size: 14px;
        }

        .card {
            background: white;

            border-radius: 12px;

            padding: 20px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.06);

            overflow-x: auto;
        }

        .second-card {
            margin-top: 24px;
        }

        .second-card h2 {
            margin-top: 0;
            margin-bottom: 20px;

            font-size: 20px;
        }

        .data-table {
            width: 100%;

            border-collapse: collapse;

            font-size: 14px;

            white-space: nowrap;
        }

        .data-table thead th {
            background: #111827;
            color: white;

            padding: 14px 16px;

            text-align: center;

            font-weight: 600;

            border: none;
        }

        .data-table thead th:first-child {
            text-align: left;
        }

        .data-table tbody th {
            text-align: left;

            font-weight: 600;

            padding: 13px 16px;

            border-bottom:
                1px solid #e5e7eb;
        }

        .data-table tbody td {
            text-align: center;

            padding: 13px 16px;

            border-bottom:
                1px solid #e5e7eb;

            line-height: 1.8;
        }

        .data-table tbody tr:hover {
            background: #f3f4f6;
        }

        .data-table tbody tr:first-child {
            background: #ecfdf5;
        }

        .data-table tbody tr:first-child:hover {
            background: #d1fae5;
        }

        .chart-card {
            margin-top: 24px;
            text-align: center;
        }

        .chart-card h2 {
            margin-top: 0;
            margin-bottom: 20px;

            font-size: 20px;
        }

        .chart-card img {
            display: block;

            max-width: 100%;
            height: auto;

            margin: 0 auto;
        }

        .footer {
            margin-top: 16px;

            font-size: 12px;

            color: #9ca3af;

            text-align: right;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="header">

            <h1>Feature Sets Comparison</h1>

            <p>
                Generated by Modelens
            </p>

        </div>

        <div class="card">
            <table class="dataframe data-table">
  <thead>
    <tr style="text-align: right;">
      <th></th>
      <th>Features</th>
      <th>Test R2</th>
      <th>Test RMSE</th>
      <th>R2 Gap</th>
      <th>RMSE Gap</th>
    </tr>
    <tr>
      <th>Feature Set</th>
      <th></th>
      <th></th>
      <th></th>
      <th></th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th>All Features</th>
      <td>8</td>
      <td>0.8869 ± 0.0225</td>
      <td>2.5968 ± 0.3357</td>
      <td>0.106217</td>
      <td>1.953319</td>
    </tr>
    <tr>
      <th>Model Year + Weight</th>
      <td>2</td>
      <td>0.8375 ± 0.0253</td>
      <td>3.1213 ± 0.3976</td>
      <td>0.126695</td>
      <td>1.646618</td>
    </tr>
  </tbody>
</table>
        </div>

        

        

        <div class="footer">
            Modelens ML Analysis
        </div>

    </div>

</body>

</html>
